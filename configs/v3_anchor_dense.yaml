# V3 dense — same as v3_anchor but with denser anchors (keep_every=2, ~46).
# Tests whether more anchors help the pose/SSM solve, especially worst-case ears.
_base: base.yaml
name: v3_anchor_dense
description: "v3 anchor-cascade with keep_every=2 (~46 anchors), 2 stages, richer features"

model:
  anchor_cascade:
    enabled: true
    keep_every: 2
    n_stages: 2
  refine:
    legacy_snap: true
    anchor_cascade: true
